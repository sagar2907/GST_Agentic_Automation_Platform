# Postgres carries two unrelated jobs: the durable workflow store and the
# pgvector precedent index. Keeping them in one instance avoids a second
# datastore for what is, at portfolio scale, a few thousand vectors.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gstrecon
      POSTGRES_PASSWORD: gstrecon
      POSTGRES_DB: gstrecon
    # 5433 on the host so a pre-existing local Postgres on 5432 is left alone.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gstrecon -d gstrecon"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
