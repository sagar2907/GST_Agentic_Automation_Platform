[project]
name = "gst-recon"
version = "0.1.0"
description = "Three-tier reconciliation of a purchase register against GSTR-2B and the IMS queue"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "tenacity>=9.0",
    "polars>=1.0",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "numpy>=2.1",
    "dbos>=2.29.0",
]

[project.scripts]
gst-recon = "gst_recon.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "time-machine>=2.15",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "markdown>=3.10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gst_recon"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PL", "ARG", "C4", "DTZ"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits a real provider API; deselected by default via 'make test'",
]

[tool.mypy]
python_version = "3.12"
packages = ["gst_recon"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
